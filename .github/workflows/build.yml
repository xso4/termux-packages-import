# .github/workflows/build.yml

name: Build FFmpeg for Termux

on:
  # 允许您从 GitHub Actions 页面手动触发此工作流
  workflow_dispatch:

  # 设置定时任务，北京时间周五凌晨1点48分
  schedule:
    - cron: '48 17 * * 4'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # 需要写入权限来创建和上传 GitHub Release
      contents: write

    steps:
      - name: Checkout 'source' branch for building
        uses: actions/checkout@v4
        with:
          # 从您的仓库中拉取 source 分支的代码
          repository: ${{ github.repository }}
          ref: 'source'
          # 将代码检出到名为 'termux-packages' 的子目录中
          path: 'termux-packages'

      - name: Setup Termux Build Environment
        working-directory: ./termux-packages
        run: |
          # 运行官方的设置脚本
          sudo apt-get update -y
          ./scripts/setup-ubuntu.sh
          ./scripts/setup-android-sdk.sh

      - name: Patch ffmpeg build.sh for libfdk-aac
        working-directory: ./termux-packages
        run: |
          # 定义要修改的 build.sh 文件路径
          FFMPEG_BUILD_SH="packages/ffmpeg/build.sh"
          echo "--- Modifying ${FFMPEG_BUILD_SH} ---"

          # 1. 在 TERMUX_PKG_DEPENDS 变量末尾添加 libfdk-aac
          #    使用 sed 找到以 TERMUX_PKG_DEPENDS= 开头的行，并在末尾的引号前添加依赖
          echo "Adding 'libfdk-aac' to TERMUX_PKG_DEPENDS..."
          sed -i '/^TERMUX_PKG_DEPENDS=/ s/"$/, libfdk-aac"/' "$FFMPEG_BUILD_SH"

          # 2. 修改 ./configure 参数
          #    检查是否存在 --disable-libfdk-aac
          if grep -q -- '--disable-libfdk-aac' "$FFMPEG_BUILD_SH"; then
            echo "Found '--disable-libfdk-aac', replacing it..."
            # 如果存在，则将其替换为 --enable-libfdk-aac 和 --enable-nonfree
            # 's|old|new|' 格式可以避免路径中的斜杠问题，这里用 | 作为分隔符
            sed -i 's|--disable-libfdk-aac|--enable-libfdk-aac \\\n\t\t--enable-nonfree|' "$FFMPEG_BUILD_SH"
          else
            echo "'--disable-libfdk-aac' not found, appending new flags..."
            # 如果不存在，则在 './configure' 参数列表的末尾（通常是某个已知标志之后）追加
            # 我们选择在 '--disable-vulkan \' 这一行之后追加新行
            sed -i '/--disable-vulkan/a \ \ \ \ \ \ \ \ --enable-libfdk-aac \\\n\ \ \ \ \ \ \ \ --enable-nonfree \\' "$FFMPEG_BUILD_SH"
          fi
          
          echo "--- Patched file content: ---"
          grep -C 5 "libfdk-aac" "$FFMPEG_BUILD_SH"
          echo "---------------------------"

      - name: Build ffmpeg package
        working-directory: ./termux-packages
        run: |
          # 开始编译，-a aarch64 指定了目标平台
          # 可修改，若在 aarch64 和 ffmpeg 之间增加 -i 参数，脚本会从 Termux 的软件仓库直接下载依赖包的预编译二进制文件，而不是在本地编译这些依赖
          ./build-package.sh -a aarch64 -i ffmpeg

      - name: Prepare Release Assets
        id: prep
        working-directory: ./termux-packages
        run: |
          # 从 build.sh 中提取版本和修订号
          VERSION=$(grep 'TERMUX_PKG_VERSION=' packages/ffmpeg/build.sh | cut -d'=' -f2)
          REVISION=$(grep 'TERMUX_PKG_REVISION=' packages/ffmpeg/build.sh | cut -d'=' -f2)
          
          # 获取当前日期
          DATE=$(date +%Y.%m.%d)
          
          # 设置 Release 的 Tag 和标题
          TAG_NAME="ffmpeg-v${VERSION}-${REVISION}-${DATE}"
          RELEASE_TITLE="FFmpeg v${VERSION}-${REVISION} (${DATE})"
          
          echo "Release Tag: ${TAG_NAME}"
          echo "Release Title: ${RELEASE_TITLE}"
          
          # 找到编译生成的 .deb 文件
          DEB_FILE=$(find output -name "ffmpeg*.deb")
          if [ -z "$DEB_FILE" ]; then
            echo "::error::Build failed, FFmpeg .deb file not found."
            exit 1
          fi
          
          # 将变量输出，供后续步骤使用
          echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "title=${RELEASE_TITLE}" >> $GITHUB_OUTPUT
          echo "deb_path=${DEB_FILE}" >> $GITHUB_OUTPUT
          echo "deb_name=$(basename "${DEB_FILE}")" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # 使用上一步生成的 Tag 和标题
          tag_name: ${{ steps.prep.outputs.tag }}
          name: ${{ steps.prep.outputs.title }}
          
          # Release 的描述内容
          body: |
            Automated build of FFmpeg for Termux (aarch64).
            - Based on termux/termux-packages `source` branch.
            - Enabled `libfdk-aac` (non-free).

          # 要上传的文件列表
          files: |
            ./termux-packages/${{ steps.prep.outputs.deb_path }}
            
          # 如果找不到文件则失败
          fail_on_unmatched_files: true
