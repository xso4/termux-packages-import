# .github/workflows/build.yml

name: Build Termux FFmpeg with fdk-aac

on:
  # 允许手动从 GitHub Actions 页面触发此工作流
  workflow_dispatch:

  # （可选）在每周一的 UTC 时间 02:00 自动运行
  schedule:
    - cron: '0 2 * * 1'

  # （可选）当 automation 分支有新的推送时运行，方便测试工作流本身
  push:
    branches:
      - automation

jobs:
  build:
    runs-on: ubuntu-latest
    
    # 授予创建 Release 的权限
    permissions:
      contents: write

    steps:
      - name: Checkout the source branch for building
        uses: actions/checkout@v4
        with:
          # 明确指定拉取 source 分支
          ref: source
          # 将代码检出到 termux-packages 子目录中
          path: termux-packages

      - name: Set up build environment (Ubuntu)
        working-directory: ./termux-packages
        run: |
          sudo apt-get update
          ./scripts/setup-ubuntu.sh

      - name: Cache Android SDK
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: ~/android-sdk
          key: ${{ runner.os }}-android-sdk-${{ hashFiles('termux-packages/scripts/setup-android-sdk.sh') }}

      - name: Set up Android SDK
        # 只有在缓存未命中时才运行安装
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        working-directory: ./termux-packages
        run: ./scripts/setup-android-sdk.sh

      - name: Modify ffmpeg build.sh for fdk-aac
        working-directory: ./termux-packages
        run: |
          FFMPEG_BUILD_SCRIPT="./packages/ffmpeg/build.sh"
          echo ">>> Modifying ${FFMPEG_BUILD_SCRIPT} to enable libfdk-aac..."

          # 1. 在 TERMUX_PKG_DEPENDS 中添加 libfdk-aac
          #    使用 sed 在依赖列表的末尾双引号前添加 ", libfdk-aac"
          #    这假设原字符串以 " 结尾
          sed -i 's/"$/, libfdk-aac"/' "${FFMPEG_BUILD_SCRIPT}"
          echo "Added 'libfdk-aac' to TERMUX_PKG_DEPENDS."

          # 2. 将 --disable-libfdk-aac 替换为 --enable-libfdk-aac 和 --enable-nonfree
          #    根据 termux-packages 的 build.sh 脚本，--disable-libfdk-aac 几乎总是存在
          sed -i 's/--disable-libfdk-aac/--enable-libfdk-aac --enable-nonfree/' "${FFMPEG_BUILD_SCRIPT}"
          echo "Replaced '--disable-libfdk-aac' with '--enable-libfdk-aac --enable-nonfree'."

          echo ">>> Patched ffmpeg build script:"
          grep -C 3 "libfdk-aac" "${FFMPEG_BUILD_SCRIPT}"

      - name: Build ffmpeg package
        working-directory: ./termux-packages
        run: |
          # -a aarch64: 指定目标架构
          # -i: 从官方源下载并安装预编译的依赖，大大加快CI构建速度
          ./build-package.sh -a aarch64 -i ffmpeg

      - name: Prepare release assets
        id: prepare-release
        run: |
          # 从 build.sh 中提取版本号
          VERSION=$(grep 'TERMUX_PKG_VERSION=' termux-packages/packages/ffmpeg/build.sh | cut -d'=' -f2)
          # 获取当前日期
          DATE=$(date +%Y%m%d)

          # 设置 Release 的 tag 和 title
          TAG_NAME="ffmpeg-${VERSION}-${DATE}"
          RELEASE_TITLE="FFmpeg ${VERSION} (built on ${DATE})"
          
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "title=${RELEASE_TITLE}" >> $GITHUB_OUTPUT
          
          # 找出编译好的 .deb 文件
          DEB_FILE=$(find termux-packages/output -name "ffmpeg_*_aarch64.deb")
          echo "deb_path=${DEB_FILE}" >> $GITHUB_OUTPUT
          
          echo "Release Tag: ${TAG_NAME}"
          echo "Release Title: ${RELEASE_TITLE}"
          echo "Artifact Path: ${DEB_FILE}"

      - name: Create GitHub Release and Upload Artifact
        uses: softprops/action-gh-release@v2
        with:
          # 使用上一步生成的 tag 和 title
          tag_name: ${{ steps.prepare-release.outputs.tag }}
          name: ${{ steps.prepare-release.outputs.title }}
          body: |
            Automated FFmpeg build for Termux (aarch64) with libfdk-aac support enabled.
            
            - **FFmpeg Version:** `${{ steps.prepare-release.outputs.version }}`
            - **Source:** Based on `termux/termux-packages` `source` branch.
          # 指定要上传的文件
          files: ${{ steps.prepare-release.outputs.deb_path }}
